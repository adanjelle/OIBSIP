<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ebf1;
    --card: #f6f7fa;
    --screen: #ffffff;
    --ink: #151a26;
    --muted: #7a8296;
    --key: #ffffff;
    --key-hover: #f0f2f7;
    --key-border: #dde1ea;
    --op: #dfe6fc;
    --op-ink: #2b4fd8;
    --eq: #2f55e0;
    --eq-ink: #ffffff;
    --clear-ink: #c2412d;
    --error: #c2412d;
    --shadow: 0 1px 2px rgba(21,26,38,.06), 0 24px 48px -16px rgba(21,26,38,.18);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #181c26; --screen: #0f1218; --ink: #eef1f8; --muted: #8b93a8;
      --key: #232837; --key-hover: #2c3244; --key-border: #2c3244;
      --op: #28345f; --op-ink: #aebdff; --eq: #5b7cff; --eq-ink: #0c1124;
      --clear-ink: #ff8f7d; --error: #ff8f7d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --card: #181c26; --screen: #0f1218; --ink: #eef1f8; --muted: #8b93a8;
    --key: #232837; --key-hover: #2c3244; --key-border: #2c3244;
    --op: #28345f; --op-ink: #aebdff; --eq: #5b7cff; --eq-ink: #0c1124;
    --clear-ink: #ff8f7d; --error: #ff8f7d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: var(--bg); color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .calculator {
    width: 100%; max-width: 360px; padding: 18px; border-radius: 28px;
    background: var(--card); box-shadow: var(--shadow);
  }
  .screen {
    min-height: 124px; padding: 18px 20px 16px; margin-bottom: 16px; border-radius: 18px;
    background: var(--screen); border: 1px solid var(--key-border);
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
    overflow: hidden; text-align: right;
  }
  .expression {
    min-height: 22px; max-width: 100%; font-size: .9rem; font-weight: 500; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl;
  }
  .result {
    max-width: 100%; font-size: 2.75rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.1;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
  }
  .result.md { font-size: 2.1rem; }
  .result.sm { font-size: 1.55rem; }
  .result.error { color: var(--error); font-size: 1.3rem; font-weight: 600; letter-spacing: 0; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 64px; gap: 10px; }
  .key {
    border: 1px solid var(--key-border); border-radius: 16px; background: var(--key); color: var(--ink);
    font: inherit; font-size: 1.3rem; font-weight: 600; cursor: pointer;
    transition: background-color .12s ease, transform .08s ease;
  }
  .key:hover { background: var(--key-hover); }
  .key:active { transform: scale(.96); }
  .key:focus-visible { outline: 3px solid var(--op-ink); outline-offset: 2px; }
  .key.op { background: var(--op); border-color: transparent; color: var(--op-ink); font-size: 1.5rem; }
  .key.op:hover { filter: brightness(.96); }
  .key.clear { color: var(--clear-ink); }
  .key.equals { background: var(--eq); border-color: transparent; color: var(--eq-ink); grid-row: span 2; font-size: 1.7rem; }
  .key.equals:hover { filter: brightness(1.08); }
  .key.zero { grid-column: span 2; }
  @media (max-width: 380px) {
    .keys { grid-auto-rows: 58px; gap: 8px; }
    .result { font-size: 2.3rem; }
  }
  @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
</style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <section class="screen" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <div class="keys" role="group" aria-label="Calculator keys">
      <button class="key clear" data-action="clear" aria-label="Clear">C</button>
      <button class="key" data-action="backspace" aria-label="Delete last character">⌫</button>
      <button class="key op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>
      <button class="key op" data-action="operator" data-value="×" aria-label="Multiply">×</button>

      <button class="key" data-action="digit" data-value="7">7</button>
      <button class="key" data-action="digit" data-value="8">8</button>
      <button class="key" data-action="digit" data-value="9">9</button>
      <button class="key op" data-action="operator" data-value="−" aria-label="Subtract">−</button>

      <button class="key" data-action="digit" data-value="4">4</button>
      <button class="key" data-action="digit" data-value="5">5</button>
      <button class="key" data-action="digit" data-value="6">6</button>
      <button class="key op" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button class="key" data-action="digit" data-value="1">1</button>
      <button class="key" data-action="digit" data-value="2">2</button>
      <button class="key" data-action="digit" data-value="3">3</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>

      <button class="key zero" data-action="digit" data-value="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
    </div>
  </main>

<script>
(() => {
  'use strict';

  const MAX_DIGITS = 15;
  const exprEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');

  // tokens holds completed numbers and operators; current is the number being typed
  const state = { tokens: [], current: '0', evaluated: false, error: false };

  const reset = () => {
    state.tokens = [];
    state.current = '0';
    state.evaluated = false;
    state.error = false;
    state.errorMsg = '';
    state.summary = '';
  };

  const group = (str) => {
    if (str === '' || str.includes('e')) return str;
    const neg = str.startsWith('-');
    const [int, dec] = (neg ? str.slice(1) : str).split('.');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + grouped + (dec !== undefined ? '.' + dec : '');
  };

  const render = () => {
    if (state.error) {
      exprEl.textContent = '';
      resultEl.textContent = state.errorMsg;
      resultEl.className = 'result error';
      return;
    }
    const text = group(state.current === '' ? last(state.tokens) : state.current);
    resultEl.textContent = text;
    resultEl.className = 'result' + (text.length > 14 ? ' sm' : text.length > 9 ? ' md' : '');
    exprEl.textContent = state.evaluated ? state.summary : formatTokens(state.tokens);
  };

  const formatTokens = (tokens) => tokens.map(t => (/\d/.test(t) ? group(t) : t)).join(' ');
  const last = (arr) => arr[arr.length - 1];
  const isOperator = (t) => ['+', '−', '×', '÷'].includes(t);

  const fail = (msg) => {
    reset();
    state.error = true;
    state.errorMsg = msg;
  };

  const compute = (tokens) => {
    // Pass 1: × and ÷ (higher precedence). Pass 2: + and −.
    const stack = [parseFloat(tokens[0])];
    for (let i = 1; i < tokens.length; i += 2) {
      const op = tokens[i];
      const n = parseFloat(tokens[i + 1]);
      if (op === '×') stack.push(stack.pop() * n);
      else if (op === '÷') {
        if (n === 0) return null;
        stack.push(stack.pop() / n);
      } else stack.push(op, n);
    }
    let total = stack[0];
    for (let i = 1; i < stack.length; i += 2) {
      total = stack[i] === '+' ? total + stack[i + 1] : total - stack[i + 1];
    }
    return total;
  };

  const formatResult = (n) => {
    const rounded = parseFloat(n.toPrecision(12));
    if (Math.abs(rounded) >= 1e15 || (rounded !== 0 && Math.abs(rounded) < 1e-9)) {
      return rounded.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
    }
    return String(rounded);
  };

  const actions = {
    digit(d) {
      if (state.error || state.evaluated) reset();
      if (state.current === '0') state.current = d;
      else if (state.current.replace(/[-.]/g, '').length < MAX_DIGITS) state.current += d;
    },
    decimal() {
      if (state.error || state.evaluated) reset();
      if (state.current === '') state.current = '0.';
      else if (!state.current.includes('.')) state.current += '.';
    },
    operator(op) {
      if (state.error) return;
      state.evaluated = false;
      if (state.current === '') {
        state.tokens[state.tokens.length - 1] = op; // swap the pending operator
      } else {
        state.tokens.push(String(parseFloat(state.current)), op);
        state.current = '';
      }
    },
    equals() {
      if (state.error || state.tokens.length === 0 || state.current === '') return;
      const tokens = [...state.tokens, String(parseFloat(state.current))];
      const total = compute(tokens);
      if (total === null) { fail('Cannot divide by zero'); return; }
      state.summary = formatTokens(tokens) + ' =';
      state.tokens = [];
      state.current = formatResult(total);
      state.evaluated = true;
    },
    clear() { reset(); },
    backspace() {
      if (state.error || state.evaluated) { reset(); return; }
      if (state.current !== '') {
        state.current = state.current.slice(0, -1);
        if (state.current === '' || state.current === '-') state.current = '';
        if (state.current === '' && state.tokens.length === 0) state.current = '0';
      } else {
        state.tokens.pop(); // drop pending operator
        state.current = state.tokens.pop() || '0';
      }
    }
  };

  const dispatch = (action, value) => {
    actions[action](value);
    render();
  };

  document.querySelectorAll('.key').forEach((btn) => {
    btn.addEventListener('click', () => dispatch(btn.dataset.action, btn.dataset.value));
  });

  // Keyboard support
  const keyMap = { '+': '+', '-': '−', '*': '×', '/': '÷', 'x': '×' };
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) dispatch('digit', e.key);
    else if (e.key === '.' || e.key === ',') dispatch('decimal');
    else if (keyMap[e.key]) { e.preventDefault(); dispatch('operator', keyMap[e.key]); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); dispatch('equals'); }
    else if (e.key === 'Backspace') dispatch('backspace');
    else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') dispatch('clear');
  });

  render();
})();
</script>
</body>
</html>
